<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .quiz-container {
            max-width: 700px;
            margin: 2rem auto;
        }

        .answer-btn {
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        .answer-btn.correct {
            background-color: #16a34a;
            /* green-600 */
            border-color: #15803d;
            /* green-700 */
            color: white;
        }

        .answer-btn.incorrect {
            background-color: #dc2626;
            /* red-600 */
            border-color: #b91c1c;
            /* red-700 */
            color: white;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        .answer-btn:not(:disabled):hover {
            background-color: #f3f4f6;
            /* gray-100 */
        }

        .order-btn.selected {
            background-color: #4f46e5;
            /* indigo-600 */
            color: white;
            border-color: #4338ca;
            /* indigo-700 */
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div id="quiz-container" class="quiz-container w-full bg-white p-6 sm:p-8 rounded-2xl shadow-lg">

        <!-- Start Screen -->
        <div id="start-screen" class="text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Cyber Security Quiz</h1>
            <p class="text-gray-600 mb-4">Test your knowledge with 41 questions. You have 25 minutes.</p>

            <div class="mb-6">
                <p class="text-gray-700 font-semibold mb-3">Choose Question Order:</p>
                <div class="flex justify-center gap-4">
                    <button id="order-in-order"
                        class="order-btn selected flex-1 border border-gray-300 font-semibold py-2 px-4 rounded-lg transition-colors">In
                        Order</button>
                    <button id="order-random"
                        class="order-btn flex-1 border border-gray-300 font-semibold py-2 px-4 rounded-lg transition-colors">Random</button>
                </div>
            </div>

            <button id="start-btn"
                class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition-colors duration-300 text-lg">
                Start Quiz
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-indigo-600">Question <span id="question-number"></span>/41</h2>
                <div id="timer" class="text-lg font-semibold bg-indigo-100 text-indigo-800 px-4 py-2 rounded-lg">25:00
                </div>
            </div>

            <div class="mb-6">
                <p id="question-text" class="text-xl font-medium text-gray-900 leading-relaxed"></p>
            </div>

            <div id="answer-buttons" class="grid grid-cols-1 gap-4">
                <!-- Answer buttons will be inserted here by JS -->
            </div>

            <div id="feedback" class="mt-4 text-center font-medium"></div>

            <div id="explanation-container" class="hidden mt-4 text-center">
                <p id="explanation-text" class="text-sm text-gray-700 bg-gray-100 p-3 rounded-lg"></p>
            </div>

            <button id="next-btn"
                class="hidden w-full mt-6 bg-gray-800 text-white font-bold py-3 px-6 rounded-lg hover:bg-gray-900 transition-colors duration-300">
                Next Question
            </button>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Cyber Security Quiz</h1>
            <p class="text-gray-600 mb-6">Here's your result:</p>
            <div class="bg-indigo-100 p-6 rounded-xl mb-6">
                <p class="text-lg text-gray-700">Your Score:</p>
                <p id="score-text" class="text-5xl font-bold text-indigo-600"></p>
            </div>
            <button id="restart-btn"
                class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition-colors duration-300 text-lg">
                Restart Quiz
            </button>
        </div>

    </div>

    <script>
        // --- QUIZ DATA ---
        const questions = [
            { question: "What is a computer hacker ?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What measures can reduce the social engineering attack surface ?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is malicious software that infects computers ?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is encryption ?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is a cyberattack ?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is cybersecurity ?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is a password?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "- June - 2026 (.", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is a computer virus?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is social engineering ?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "Which of the following is not a hacker?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is a computer backup?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is ransomware?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "It is a type of email virus that replicates itself, steals information, or damages a computer system.", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "What is the biggest threat to cybersecurity?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "Attacks in which attackers attempt to discover passwords for protected online accounts and social media platforms?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "Which of the following is an example of authentication?", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "- June - 2026 (.", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "The Information Security Triad (CIA Triad) model includes data confidentiality, integrity, and availability.", answers: [{text: "True", correct: true}, {text: "False", correct: false}] },
            { question: "The Information Security Triad (CIA Triad) model focuses on data availability integrity, and reliability.  (confidentiality).", answers: [{text: "True", correct: false}, {text: "False", correct: true}], explanation: "Explanation: الشية" },
            { question: "The Information Security Triad (CIA Triad) model is used to ensure the security of data and systems.", answers: [{text: "True", correct: true}, {text: "False", correct: false}] },
            { question: "The Information Security Triad (CIA Triad) is a guiding framework that organizations should follow when protecting information.", answers: [{text: "True", correct: true}, {text: "False", correct: false}] },
            { question: "The primary goal of the Information Security Triad (CIA Triad) is to protect data from any unauthorized access. (+ availability and integrity).", answers: [{text: "True", correct: true}, {text: "False", correct: false}], explanation: "Explanation: بالإضافة إلى السلامة والتوافر" },
            { question: "“Availability" ensures that authorized users can access data when they need it within an appropriate time frame.", answers: [{text: "True", correct: true}, {text: "False", correct: false}], explanation: "Explanation: بشكل متسق وموثوق" },
            { question: ""Integrity" refers to ensuring that no one can modify data without permission.", answers: [{text: "True", correct: true}, {text: "False", correct: false}], explanation: "Explanation: وضمان موثوقيتها واتساقها ودقتها" },
            { question: "One example of confidentiality is encrypting documents on a computer system so that no one can read them except the authorized user(s).", answers: [{text: "True", correct: true}, {text: "False", correct: false}] },
            { question: ""Confidentiality" refers to the system's ability to maintain data privacy and restrict access to unauthorized individuals.", answers: [{text: "True", correct: true}, {text: "False", correct: false}] },
            { question: "Online Piracy is a legal activity if done online. (Illegal).", answers: [{text: "True", correct: false}, {text: "False", correct: true}] },
            { question: "- June - 2026 (.", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "In phishing attacks, victims provide their login information on fake websites.", answers: [{text: "True", correct: true}, {text: "False", correct: false}] },
            { question: "A large number of downloads always guarantees that an app is safe.", answers: [{text: "True", correct: false}, {text: "False", correct: true}], explanation: "Explanation: لا يضمن ذلك" },
            { question: "ATM Fraud always requires knowing the victim's PIN.", answers: [{text: "True", correct: false}, {text: "False", correct: true}], explanation: "Explanation: به او بدونه" },
            { question: "Public Wi-Fi networks are always secure. (unsecure).", answers: [{text: "True", correct: false}, {text: "False", correct: true}], explanation: "Explanation: غتر آمنة" },
            { question: "Avoid visiting websites that don't have ....... , in the URL.", answers: [{text: "URL  HTTPS", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "Installing reliable antivirus software helps prevent ...... and viruses.", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "Multi-Factor Authentication (MFA) means.", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "One way to protect your data is …", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "A Denial-of-Service (DOS) attack aims to:.", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "Ethical hackers, use their skills and ability to conduct penetration testing to uncover and report security vulnerabilities to the organization owner in exchange for money.", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
            { question: "The social engineering targets people.", answers: [{text: "True", correct: true}, {text: "False", correct: false}] },
            { question: "- June - 2026 (.", answers: [{text: "", correct: true}, {text: "Option B", correct: false}, {text: "Option C", correct: false}] },
        ];

        // --- DOM ELEMENTS ---
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');

        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const orderInOrderBtn = document.getElementById('order-in-order');
        const orderRandomBtn = document.getElementById('order-random');

        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const answerButtonsEl = document.getElementById('answer-buttons');
        const feedbackEl = document.getElementById('feedback');
        const explanationContainer = document.getElementById('explanation-container');
        const explanationText = document.getElementById('explanation-text');
        const scoreTextEl = document.getElementById('score-text');
        const timerEl = document.getElementById('timer');

        // --- QUIZ STATE ---
        let currentQuestionIndex;
        let score;
        let timerInterval;
        let quizOrder = 'in-order'; // 'in-order' or 'random'
        let quizQuestions = [];

        // --- EVENT LISTENERS ---
        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            setNextQuestion();
        });
        restartBtn.addEventListener('click', () => {
            resultsScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });
        orderInOrderBtn.addEventListener('click', () => {
            quizOrder = 'in-order';
            orderInOrderBtn.classList.add('selected');
            orderRandomBtn.classList.remove('selected');
        });
        orderRandomBtn.addEventListener('click', () => {
            quizOrder = 'random';
            orderRandomBtn.classList.add('selected');
            orderInOrderBtn.classList.remove('selected');
        });

        // --- FUNCTIONS ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;

            if (quizOrder === 'random') {
                quizQuestions = [...questions];
                shuffleArray(quizQuestions);
            } else {
                quizQuestions = [...questions];
            }

            startScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            nextBtn.classList.add('hidden');

            startTimer();
            setNextQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            let time = 25 * 60; // 25 minutes in seconds

            timerInterval = setInterval(() => {
                const minutes = Math.floor(time / 60);
                let seconds = time % 60;
                seconds = seconds < 10 ? '0' + seconds : seconds;

                timerEl.textContent = `${minutes}:${seconds}`;
                time--;

                if (time < 0) {
                    clearInterval(timerInterval);
                    showResults();
                }
            }, 1000);
        }

        function setNextQuestion() {
            resetState();
            if (currentQuestionIndex < quizQuestions.length) {
                showQuestion(quizQuestions[currentQuestionIndex]);
            } else {
                showResults();
            }
        }

        function showQuestion(question) {
            questionNumberEl.innerText = currentQuestionIndex + 1;
            questionTextEl.innerText = question.question;

            let answers = [...question.answers];
            if (quizOrder === 'random') {
                shuffleArray(answers);
            }

            answers.forEach(answer => {
                const button = document.createElement('button');
                button.innerText = answer.text;
                button.classList.add('w-full', 'border', 'border-gray-300', 'text-gray-700', 'font-semibold', 'py-3', 'px-4', 'rounded-lg', 'text-left', 'answer-btn');
                if (answer.correct) {
                    button.dataset.correct = answer.correct;
                }
                button.addEventListener('click', selectAnswer);
                answerButtonsEl.appendChild(button);
            });
        }

        function resetState() {
            nextBtn.classList.add('hidden');
            feedbackEl.innerText = '';
            explanationContainer.classList.add('hidden');
            explanationText.innerText = '';
            while (answerButtonsEl.firstChild) {
                answerButtonsEl.removeChild(answerButtonsEl.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === 'true';

            if (isCorrect) {
                score++;
                selectedBtn.classList.add('correct');
                feedbackEl.innerText = "Correct!";
                feedbackEl.style.color = '#16a34a';
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackEl.innerText = "Sorry, that's not right.";
                feedbackEl.style.color = '#dc2626';
            }

            Array.from(answerButtonsEl.children).forEach(button => {
                if (button.dataset.correct === 'true') {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });

            const currentQuestion = quizQuestions[currentQuestionIndex];
            if (currentQuestion.explanation) {
                explanationText.innerText = currentQuestion.explanation;
                explanationContainer.classList.remove('hidden');
            }

            if (quizQuestions.length > currentQuestionIndex + 1) {
                nextBtn.classList.remove('hidden');
            } else {
                nextBtn.innerText = 'Show Results';
                nextBtn.classList.remove('hidden');
            }
        }

        function showResults() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            scoreTextEl.innerText = `${score} / ${quizQuestions.length}`;
            nextBtn.innerText = 'Next Question';
        }

    </script>
</body>

</html>
