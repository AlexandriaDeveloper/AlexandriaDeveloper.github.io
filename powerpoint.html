<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerPoint Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .quiz-container {
            max-width: 700px;
            margin: 2rem auto;
        }

        .answer-btn {
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        .answer-btn.correct {
            background-color: #16a34a;
            /* green-600 */
            border-color: #15803d;
            /* green-700 */
            color: white;
        }

        .answer-btn.incorrect {
            background-color: #dc2626;
            /* red-600 */
            border-color: #b91c1c;
            /* red-700 */
            color: white;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        .answer-btn:not(:disabled):hover {
            background-color: #f3f4f6;
            /* gray-100 */
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div id="quiz-container" class="quiz-container w-full bg-white p-6 sm:p-8 rounded-2xl shadow-lg">

        <!-- Start Screen -->
        <div id="start-screen" class="text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">PowerPoint Skills Quiz</h1>
            <p class="text-gray-600 mb-6">Test your knowledge with 66 questions. You have 25 minutes.</p>
            <button id="start-btn"
                class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition-colors duration-300 text-lg">
                Start Quiz
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-indigo-600">Question <span id="question-number"></span>/66</h2>
                <div id="timer" class="text-lg font-semibold bg-indigo-100 text-indigo-800 px-4 py-2 rounded-lg">25:00
                </div>
            </div>

            <div class="mb-6">
                <p id="question-text" class="text-xl font-medium text-gray-900 leading-relaxed"></p>
            </div>

            <div id="answer-buttons" class="grid grid-cols-1 gap-4">
                <!-- Answer buttons will be inserted here by JS -->
            </div>

            <div id="feedback" class="mt-4 text-center font-medium"></div>

            <button id="next-btn"
                class="hidden w-full mt-6 bg-gray-800 text-white font-bold py-3 px-6 rounded-lg hover:bg-gray-900 transition-colors duration-300">
                Next Question
            </button>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Quiz Complete!</h1>
            <p class="text-gray-600 mb-6">Here's your result:</p>
            <div class="bg-indigo-100 p-6 rounded-xl mb-6">
                <p class="text-lg text-gray-700">Your Score:</p>
                <p id="score-text" class="text-5xl font-bold text-indigo-600"></p>
            </div>
            <button id="restart-btn"
                class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition-colors duration-300 text-lg">
                Restart Quiz
            </button>
        </div>

    </div>

    <script>
        // --- QUIZ DATA ---
        const questions = [
            { question: "When you create a new blank presentation, it begins with a slide whose layout is the title slide.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "When you create a new, blank presentation, the title slide layout name begins with one slide.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "One element can carry more than one movement.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "The main bar includes commands for references.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "Why use outline view?", answers: [{ text: "To edit bulleted addresses", correct: true }, { text: "To change the slide design", correct: false }, { text: "To add images", correct: false }] },
            { question: "To change the table style from the ... tab.", answers: [{ text: "Design", correct: true }, { text: "Layout", correct: false }, { text: "Insert", correct: false }] },
            { question: "How can you save layouts, colors, fonts, effects, background styles, and content for others to use with their presentations?", answers: [{ text: "Export the file as a template", correct: true }, { text: "Save as PDF", correct: false }, { text: "Send by email", correct: false }] },
            { question: "When splitting slides into sections, we can collapse, expand, rename or remove a section.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "You can add a chart or graph to a slide using the View tab.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "The order of items within a slide can be changed by changing the order of the slides.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "To record the screen, we click...", answers: [{ text: "Insert -> Screen Recording", correct: true }, { text: "View -> Record", correct: false }, { text: "File -> Record", correct: false }] },
            { question: "How do you resize a table after inserting it?", answers: [{ text: "By dragging its edges", correct: true }, { text: "From the 'Format' menu", correct: false }, { text: "It cannot be resized", correct: false }] },
            { question: "From one of the ways to create a presentation, press the Windows key and then choose PowerPoint.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "What command is used to add animation effects to items on slides?", answers: [{ text: "Animations Tab", correct: true }, { text: "Transitions Tab", correct: false }, { text: "Design Tab", correct: false }] },
            { question: "The appropriate view can be chosen from a set of Presentation Views commands such as Normal and Slide Sorter.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "The appropriate tab to change the background color of a table cell in PowerPoint is...", answers: [{ text: "Table Design", correct: true }, { text: "Home", correct: false }, { text: "Layout", correct: false }] },
            { question: "When you save a presentation with a .potx extension, what kind of PowerPoint file is generated?", answers: [{ text: "Template", correct: true }, { text: "PowerPoint Show", correct: false }, { text: "Video File", correct: false }] },
            { question: "To animate a three-dimensional model in slides...", answers: [{ text: "Click and drag", correct: true }, { text: "Use the arrow keys", correct: false }, { text: "It cannot be animated", correct: false }] },
            { question: "There is only one way to insert a new blank slide for your presentation.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "... is a set of pre-made fonts, colors, and special effects that complement each other.", answers: [{ text: "Theme", correct: true }, { text: "Style", correct: false }, { text: "Layout", correct: false }] },
            { question: "What happens when I press the Esc key while playing a slideshow?", answers: [{ text: "Slideshow ends", correct: true }, { text: "Go to the next slide", correct: false }, { text: "The show is paused", correct: false }] },
            { question: "To format the background of a specific slide or group of slides, use the tab...", answers: [{ text: "Design -> Format Background", correct: true }, { text: "View -> Format Background", correct: false }, { text: "Insert -> Background", correct: false }] },
            { question: "After making a wide range of formatting for colors, fonts and effects, they can be saved in a specific format on the computer to be used later.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "In the 'Sound' group, you can control the duration of the transition and even determine the sound that plays during the transition.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "The language of the program interface can be changed by tabbing the transitions.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "The presentation file can be saved as a video file.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "Animations can change the size and color of an element within a slide.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "You can save the PowerPoint file on OneDrive to access it from any device and from anywhere.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "Formatting and layout freeze when saving presentation as a ... file.", answers: [{ text: "PDF", correct: true }, { text: "PNG", correct: false }, { text: "DOCX", correct: false }] },
            { question: "To save the presentation in the latest presentation format, we choose to save with the extension...", answers: [{ text: ".pptx", correct: true }, { text: ".ppt", correct: false }, { text: ".ppsx", correct: false }] },
            { question: "To save the presentation for a PowerPoint show, we choose...", answers: [{ text: ".ppsx", correct: true }, { text: ".pptx", correct: false }, { text: ".potx", correct: false }] },
            { question: "To save the presentation to a previous version of PowerPoint, we choose to save with the extension...", answers: [{ text: ".ppt", correct: true }, { text: ".pptx", correct: false }, { text: ".pps", correct: false }] },
            { question: "To save the presentation to a previous version for a PowerPoint show, we choose...", answers: [{ text: ".pps", correct: true }, { text: ".ppt", correct: false }, { text: ".ppsx", correct: false }] },
            { question: "The presentation can be printed in grayscale.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "Animations have 5 types in PowerPoint.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "To do background formatting from the view tab, you can apply the background to the selected slide only or apply it to all slides.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "To adjust the brightness and contrast in the picture, press the color balance tool.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "To add an icon in the slide:", answers: [{ text: "Go to Insert tab and choose icon", correct: true }, { text: "Go to Design tab and choose icon", correct: false }, { text: "Go to View tab and choose icon", correct: false }] },
            { question: "The chart title appears in the slide below the chart.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "When you insert a shape to the slide, it appears automatically.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "One of the printing colors available to print the presentation file is to print in blue only.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "To change the color of the SmartArt graphic:", answers: [{ text: "Use the Format tab", correct: true }, { text: "Use the Design tab", correct: false }, { text: "Double-click on it", correct: false }] },
            { question: "To add an additional shape in a SmartArt graphic...", answers: [{ text: "Right-click on the shape and choose 'Add Shape'", correct: true }, { text: "Go to Insert -> Shape", correct: false }, { text: "You cannot add shapes", correct: false }] },
            { question: "Slide transition is the visual effect that occurs when moving from one slide to another.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "To add 3D effects to the shape, click on format and shape effect.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "The background of the current slide can be filled with an image from your computer or an image downloaded from the internet.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "You can insert multiple icons at the same time.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "Click on ... to add WordArt.", answers: [{ text: "Insert", correct: true }, { text: "Design", correct: false }, { text: "Home", correct: false }] },
            { question: "You can apply background formatting from the ... tab.", answers: [{ text: "Design", correct: true }, { text: "View", correct: false }, { text: "File", correct: false }] },
            { question: "To trim the edge of media, click on 'Trim Video' from the ... tab.", answers: [{ text: "Playback", correct: true }, { text: "Format", correct: false }, { text: "Animations", correct: false }] },
            { question: "To change the order of shapes in a SmartArt graphic, Click Ctrl + T on your keyboard.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "To open a previously saved presentation file, we press the keys Ctrl + O.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "One of the most common types of Picture formats used in online presentations is GIF.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "The purpose of The Table Design Tab in PowerPoint is to...", answers: [{ text: "Customize table formatting", correct: true }, { text: "Insert rows and columns", correct: false }, { text: "Merge cells", correct: false }] },
            { question: "This layout contains the main title and subtitle...", answers: [{ text: "Title Slide", correct: true }, { text: "Title and Content", correct: false }, { text: "Blank", correct: false }] },
            { question: "You can use ...... to delete the border between table cells.", answers: [{ text: "Eraser", correct: true }, { text: "Pen", correct: false }, { text: "Selection tool", correct: false }] },
            { question: "The text you add becomes part of the shape and if you rotate the shape the text will also rotate.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "To add graphs, click...", answers: [{ text: "Insert and then chart", correct: true }, { text: "Design and then chart", correct: false }, { text: "Data and then chart", correct: false }] },
            { question: "The best practice for using pictures in a presentation to ensure audience appeal is to avoid pictures.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }] },
            { question: "The best practice for using pictures in a presentation to ensure audience appeal is to avoid too many pictures.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "It is best to avoid mixing drawn images with photographs.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }] },
            { question: "The shape outline on the Home tab is in the ... group.", answers: [{ text: "Drawing", correct: true }, { text: "Font", correct: false }, { text: "Paragraph", correct: false }] },
            { question: "... is used to navigate from the current page to another Web Site or File.", answers: [{ text: "Hyperlink", correct: true }, { text: "Bookmark", correct: false }, { text: "Comment", correct: false }] },
            { question: "If you want to add a comment about a chart you can use a...", answers: [{ text: "Text box", correct: true }, { text: "Caption", correct: false }, { text: "Footer", correct: false }] }
        ];

        // --- DOM ELEMENTS ---
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');

        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');

        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const answerButtonsEl = document.getElementById('answer-buttons');
        const feedbackEl = document.getElementById('feedback');
        const scoreTextEl = document.getElementById('score-text');
        const timerEl = document.getElementById('timer');

        // --- QUIZ STATE ---
        let currentQuestionIndex;
        let score;
        let timerInterval;

        // --- EVENT LISTENERS ---
        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            setNextQuestion();
        });
        restartBtn.addEventListener('click', startQuiz);

        // --- FUNCTIONS ---
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;

            startScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            nextBtn.classList.add('hidden');

            startTimer();
            setNextQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            let time = 25 * 60; // 25 minutes in seconds

            timerInterval = setInterval(() => {
                const minutes = Math.floor(time / 60);
                let seconds = time % 60;
                seconds = seconds < 10 ? '0' + seconds : seconds;

                timerEl.textContent = `${minutes}:${seconds}`;
                time--;

                if (time < 0) {
                    clearInterval(timerInterval);
                    showResults();
                }
            }, 1000);
        }

        function setNextQuestion() {
            resetState();
            if (currentQuestionIndex < questions.length) {
                showQuestion(questions[currentQuestionIndex]);
            } else {
                showResults();
            }
        }

        function showQuestion(question) {
            questionNumberEl.innerText = currentQuestionIndex + 1;
            questionTextEl.innerText = question.question;
            question.answers.forEach(answer => {
                const button = document.createElement('button');
                button.innerText = answer.text;
                button.classList.add('w-full', 'border', 'border-gray-300', 'text-gray-700', 'font-semibold', 'py-3', 'px-4', 'rounded-lg', 'text-left', 'answer-btn');
                if (answer.correct) {
                    button.dataset.correct = answer.correct;
                }
                button.addEventListener('click', selectAnswer);
                answerButtonsEl.appendChild(button);
            });
        }

        function resetState() {
            nextBtn.classList.add('hidden');
            feedbackEl.innerText = '';
            while (answerButtonsEl.firstChild) {
                answerButtonsEl.removeChild(answerButtonsEl.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === 'true';

            if (isCorrect) {
                score++;
                selectedBtn.classList.add('correct');
                feedbackEl.innerText = "Correct!";
                feedbackEl.style.color = '#16a34a';
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackEl.innerText = "Sorry, that's not right.";
                feedbackEl.style.color = '#dc2626';
            }

            // Show the correct answer
            Array.from(answerButtonsEl.children).forEach(button => {
                if (button.dataset.correct === 'true') {
                    button.classList.add('correct');
                }
                button.disabled = true; // Disable all buttons
            });

            if (questions.length > currentQuestionIndex + 1) {
                nextBtn.classList.remove('hidden');
            } else {
                nextBtn.innerText = 'Show Results';
                nextBtn.classList.remove('hidden');
            }
        }

        function showResults() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            scoreTextEl.innerText = `${score} / ${questions.length}`;
            nextBtn.innerText = 'Next Question';
        }

    </script>
</body>

</html>
