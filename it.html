<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT & OS Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .quiz-container {
            max-width: 700px;
            margin: 2rem auto;
        }

        .answer-btn {
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        .answer-btn.correct {
            background-color: #16a34a;
            /* green-600 */
            border-color: #15803d;
            /* green-700 */
            color: white;
        }

        .answer-btn.incorrect {
            background-color: #dc2626;
            /* red-600 */
            border-color: #b91c1c;
            /* red-700 */
            color: white;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        .answer-btn:not(:disabled):hover {
            background-color: #f3f4f6;
            /* gray-100 */
        }

        .order-btn.selected {
            background-color: #4f46e5;
            /* indigo-600 */
            color: white;
            border-color: #4338ca;
            /* indigo-700 */
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div id="quiz-container" class="quiz-container w-full bg-white p-6 sm:p-8 rounded-2xl shadow-lg">

        <!-- Start Screen -->
        <div id="start-screen" class="text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">IT & Operating Systems Quiz</h1>
            <p class="text-gray-600 mb-4">Test your knowledge with 42 questions. You have 25 minutes.</p>

            <div class="mb-6">
                <p class="text-gray-700 font-semibold mb-3">Choose Question Order:</p>
                <div class="flex justify-center gap-4">
                    <button id="order-in-order"
                        class="order-btn selected flex-1 border border-gray-300 font-semibold py-2 px-4 rounded-lg transition-colors">In
                        Order</button>
                    <button id="order-random"
                        class="order-btn flex-1 border border-gray-300 font-semibold py-2 px-4 rounded-lg transition-colors">Random</button>
                </div>
            </div>

            <button id="start-btn"
                class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition-colors duration-300 text-lg">
                Start Quiz
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-indigo-600">Question <span id="question-number"></span>/42</h2>
                <div id="timer" class="text-lg font-semibold bg-indigo-100 text-indigo-800 px-4 py-2 rounded-lg">25:00
                </div>
            </div>

            <div class="mb-6">
                <p id="question-text" class="text-xl font-medium text-gray-900 leading-relaxed"></p>
            </div>

            <div id="answer-buttons" class="grid grid-cols-1 gap-4">
                <!-- Answer buttons will be inserted here by JS -->
            </div>

            <div id="feedback" class="mt-4 text-center font-medium"></div>

            <div id="explanation-container" class="hidden mt-4 text-center">
                <p id="explanation-text" class="text-sm text-gray-700 bg-gray-100 p-3 rounded-lg"></p>
            </div>

            <button id="next-btn"
                class="hidden w-full mt-6 bg-gray-800 text-white font-bold py-3 px-6 rounded-lg hover:bg-gray-900 transition-colors duration-300">
                Next Question
            </button>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Quiz Complete!</h1>
            <p class="text-gray-600 mb-6">Here's your result:</p>
            <div class="bg-indigo-100 p-6 rounded-xl mb-6">
                <p class="text-lg text-gray-700">Your Score:</p>
                <p id="score-text" class="text-5xl font-bold text-indigo-600"></p>
            </div>
            <button id="restart-btn"
                class="w-full bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700 transition-colors duration-300 text-lg">
                Restart Quiz
            </button>
        </div>

    </div>

    <script>
        // --- QUIZ DATA ---
        const questions = [
            { question: "The user interface that relies on writing commands to computers is referred to as GUI.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: This describes a CLI (Command-Line Interface). A GUI (Graphical User Interface) uses icons and visual indicators." },
            { question: "The user interface that relies on writing commands to computers is referred to as CLI.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: CLI stands for Command-Line Interface, which is a text-based interface for interacting with a computer." },
            { question: "User interface to give command for computer is GUI.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: A GUI (Graphical User Interface) allows users to interact with electronic devices through graphical icons and visual indicators." },
            { question: "Windows 11 includes the ability to run Android applications and games directly.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: Windows 11 introduced the Windows Subsystem for Android, enabling it to run Android apps." },
            { question: "Who is the founder of Microsoft Corporation?", answers: [{ text: "Bill Gates", correct: true }, { text: "Steve Jobs", correct: false }, { text: "Larry Page", correct: false }], explanation: "Explanation: Bill Gates co-founded Microsoft with Paul Allen in 1975." },
            { question: "The hard disk is the main secondary storage device in a computer system.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: The hard disk provides long-term, non-volatile storage for the operating system, applications, and user files." },
            { question: "A computer can operate without an operating system but cannot operate without application software.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: The opposite is true. An operating system is essential for a computer to function at all." },
            { question: "OneDrive offers 1TB of free storage space per user.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: The standard free storage tier for a basic Microsoft OneDrive account is 5 GB." },
            { question: "To count the duration of performing a task, use...", answers: [{ text: "Timer", correct: true }, { text: "Clock", correct: false }, { text: "Calendar", correct: false }], explanation: "Explanation: A timer is a specific tool designed to measure time intervals." },
            { question: "An electronic memory that contains information that is useful in the initial operation of the device.", answers: [{ text: "ROM", correct: true }, { text: "RAM", correct: false }, { text: "Cache", correct: false }], explanation: "Explanation: ROM (Read-Only Memory) contains the firmware (like BIOS/UEFI) needed to boot the computer." },
            { question: "Permanent Memory Computer devices are an electronic chip that has the ability to store information temporarily.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: Permanent memory (like ROM or a hard drive) stores information long-term. RAM is for temporary storage." },
            { question: "The ... system is an example of a multitasking program.", answers: [{ text: "Mac OS", correct: true }, { text: "MS-DOS", correct: false }, { text: "A calculator", correct: false }], explanation: "Explanation: Modern operating systems like Mac OS, Windows, and Linux are all designed for multitasking." },
            { question: "The larger the size of the RAM, the faster the computer.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: More RAM allows the computer to run more applications simultaneously without needing to use slower storage like an SSD/HDD, improving overall performance." },
            { question: "Computer software is divided into...", answers: [{ text: "Two types", correct: true }, { text: "Three types", correct: false }, { text: "Four types", correct: false }], explanation: "Explanation: The two main categories are System Software (e.g., OS, drivers) and Application Software (e.g., Word, Chrome)." },
            { question: "The Windows system enjoys a high degree of freedom to modify, operate, distribute and develop its parts.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: This describes an open-source operating system like Linux. Windows is proprietary software with restricted source code." },
            { question: "All these software applications are provided by Microsoft except...", answers: [{ text: "Google Drive", correct: true }, { text: "Microsoft Word", correct: false }, { text: "OneDrive", correct: false }], explanation: "Explanation: Google Drive is a cloud storage service provided by Google." },
            { question: "Analog computers are a combination of an analog and digital computers.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: A computer that combines both analog and digital features is called a Hybrid computer." },
            { question: "The memory unit is considered the brain of a computer.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: The CPU (Central Processing Unit) is considered the 'brain' of the computer as it performs most of the processing." },
            { question: "The arithmetic and logic unit is in the central processing unit.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: The ALU (Arithmetic and Logic Unit) is a core component of the CPU responsible for all mathematical calculations and logical operations." },
            { question: "The application used for planning events is...", answers: [{ text: "Calendar", correct: true }, { text: "Notepad", correct: false }, { text: "File Explorer", correct: false }], explanation: "Explanation: Calendar applications are specifically designed for scheduling and managing events and appointments." },
            { question: "A type of hard disk that stores data on flash memory, similar to the working principle of flash memory.", answers: [{ text: "SSD", correct: true }, { text: "HDD", correct: false }, { text: "ROM", correct: false }], explanation: "Explanation: SSD stands for Solid-State Drive and uses non-volatile flash memory to store data, offering faster speeds than traditional HDDs." },
            { question: "A metal box that contains almost all of the basic computer components is...", answers: [{ text: "The system unit", correct: true }, { text: "The motherboard", correct: false }, { text: "The power supply", correct: false }], explanation: "Explanation: The system unit, also known as the case or chassis, houses the main components of the computer." },
            { question: "...is a volatile memory.", answers: [{ text: "RAM", correct: true }, { text: "ROM", correct: false }, { text: "SSD", correct: false }], explanation: "Explanation: Volatile memory, like RAM, requires power to maintain the stored information. It loses its contents when the power is turned off." },
            { question: "The process by which you can achieve a specific idea or solve a problem by dividing it into successive steps is...", answers: [{ text: "Programming", correct: true }, { text: "Networking", correct: false }, { text: "Browsing", correct: false }], explanation: "Explanation: Programming involves writing a set of instructions (an algorithm) for a computer to follow to perform a specific task." },
            { question: "One of the most important features of the Windows 10 operating system is the voice assistant Cortana, the Microsoft Edge browser, and the presence of a graphical Start menu.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: These were all key features introduced or significantly updated with the release of Windows 10." },
            { question: "Microsoft released its first version of the Windows operating system in...", answers: [{ text: "1985", correct: true }, { text: "1995", correct: false }, { text: "2001", correct: false }], explanation: "Explanation: Microsoft released Windows 1.0 on November 20, 1985." },
            { question: "A password can be created using a picture.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: Windows offers a 'Picture Password' sign-in option where you perform specific gestures on a photo to log in." },
            { question: "Windows is an open-source Linux-based operating system developed by Google.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: This description fits the Android operating system. Windows is a proprietary OS developed by Microsoft." },
            { question: "Any program whose tasks, all or one of which, cause some kind of damage to the system.", answers: [{ text: "Malware", correct: true }, { text: "Software", correct: false }, { text: "Firmware", correct: false }], explanation: "Explanation: Malware is short for 'malicious software' and is a general term for any software intentionally designed to cause disruption or damage." },
            { question: "A hard disk covered with a magnetic layer.", answers: [{ text: "HDD", correct: true }, { text: "SSD", correct: false }, { text: "RAM", correct: false }], explanation: "Explanation: An HDD (Hard Disk Drive) uses spinning magnetic platters to read and write data." },
            { question: "The name of a file or folder is changed using the key...", answers: [{ text: "F2", correct: true }, { text: "F1", correct: false }, { text: "F5", correct: false }], explanation: "Explanation: In Windows File Explorer, selecting a file and pressing the F2 key allows you to rename it." },
            { question: "All function keys perform the same functions in all programs.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: The function of keys like F1, F2, F5, etc., is context-dependent and changes from one application to another." },
            { question: "The physical components of a computer can be seen and touched, unlike the software components.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: This is the fundamental definition of hardware (physical components) versus software (programs and data)." },
            { question: "The physical components of a computer are the components that can be seen and touched, and this includes the system unit and software.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: Software is a set of instructions and is not a physical component that can be touched." },
            { question: "Once you turn off the computer or cut off the power, RAM loses all its contents.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: RAM (Random Access Memory) is volatile, meaning it needs constant power to retain data." },
            { question: "Once you turn off the computer or cut off the power, ROM loses all its contents.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: ROM (Read-Only Memory) is non-volatile, meaning it retains its data even when the power is off." },
            { question: "An analog computer uses binary numbers.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: Digital computers use binary numbers (0s and 1s). Analog computers use continuous physical phenomena like electrical voltage." },
            { question: "A type of computer that uses binary numbers is a...", answers: [{ text: "Digital computer", correct: true }, { text: "Analog computer", correct: false }, { text: "Hybrid computer", correct: false }], explanation: "Explanation: The entire basis of modern digital computing is the binary system." },
            { question: "Analogue computers are designed to work on digital data that is presented in the form of binary numbers.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: This is the definition of a digital computer, not an analog one." },
            { question: "The metal part that contains most of the computer parts is the System unit.", answers: [{ text: "True", correct: true }, { text: "False", correct: false }], explanation: "Explanation: The system unit (or case) is the enclosure that holds the motherboard, CPU, RAM, and other core components." },
            { question: "The metal part that contains most of the computer parts is the Power unit.", answers: [{ text: "True", correct: false }, { text: "False", correct: true }], explanation: "Explanation: The Power Supply Unit (PSU) is just one component inside the System Unit." },
            { question: "To copy files and folders, you can use...", answers: [{ text: "CTRL + INSERT", correct: true }, { text: "SHIFT + INSERT", correct: false }, { text: "ALT + INSERT", correct: false }], explanation: "Explanation: CTRL + INSERT is an alternative keyboard shortcut for copying, just like CTRL + C. SHIFT + INSERT is used for pasting." }
        ];

        // --- DOM ELEMENTS ---
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');

        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const orderInOrderBtn = document.getElementById('order-in-order');
        const orderRandomBtn = document.getElementById('order-random');

        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const answerButtonsEl = document.getElementById('answer-buttons');
        const feedbackEl = document.getElementById('feedback');
        const explanationContainer = document.getElementById('explanation-container');
        const explanationText = document.getElementById('explanation-text');
        const scoreTextEl = document.getElementById('score-text');
        const timerEl = document.getElementById('timer');

        // --- QUIZ STATE ---
        let currentQuestionIndex;
        let score;
        let timerInterval;
        let quizOrder = 'in-order'; // 'in-order' or 'random'
        let quizQuestions = [];

        // --- EVENT LISTENERS ---
        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            setNextQuestion();
        });
        restartBtn.addEventListener('click', () => {
            resultsScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });
        orderInOrderBtn.addEventListener('click', () => {
            quizOrder = 'in-order';
            orderInOrderBtn.classList.add('selected');
            orderRandomBtn.classList.remove('selected');
        });
        orderRandomBtn.addEventListener('click', () => {
            quizOrder = 'random';
            orderRandomBtn.classList.add('selected');
            orderInOrderBtn.classList.remove('selected');
        });

        // --- FUNCTIONS ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;

            if (quizOrder === 'random') {
                quizQuestions = [...questions];
                shuffleArray(quizQuestions);
            } else {
                quizQuestions = [...questions];
            }

            startScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            nextBtn.classList.add('hidden');

            startTimer();
            setNextQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            let time = 25 * 60; // 25 minutes in seconds

            timerInterval = setInterval(() => {
                const minutes = Math.floor(time / 60);
                let seconds = time % 60;
                seconds = seconds < 10 ? '0' + seconds : seconds;

                timerEl.textContent = `${minutes}:${seconds}`;
                time--;

                if (time < 0) {
                    clearInterval(timerInterval);
                    showResults();
                }
            }, 1000);
        }

        function setNextQuestion() {
            resetState();
            if (currentQuestionIndex < quizQuestions.length) {
                showQuestion(quizQuestions[currentQuestionIndex]);
            } else {
                showResults();
            }
        }

        function showQuestion(question) {
            questionNumberEl.innerText = currentQuestionIndex + 1;
            questionTextEl.innerText = question.question;

            let answers = [...question.answers];
            if (quizOrder === 'random') {
                shuffleArray(answers);
            }

            answers.forEach(answer => {
                const button = document.createElement('button');
                button.innerText = answer.text;
                button.classList.add('w-full', 'border', 'border-gray-300', 'text-gray-700', 'font-semibold', 'py-3', 'px-4', 'rounded-lg', 'text-left', 'answer-btn');
                if (answer.correct) {
                    button.dataset.correct = answer.correct;
                }
                button.addEventListener('click', selectAnswer);
                answerButtonsEl.appendChild(button);
            });
        }

        function resetState() {
            nextBtn.classList.add('hidden');
            feedbackEl.innerText = '';
            explanationContainer.classList.add('hidden');
            explanationText.innerText = '';
            while (answerButtonsEl.firstChild) {
                answerButtonsEl.removeChild(answerButtonsEl.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === 'true';

            if (isCorrect) {
                score++;
                selectedBtn.classList.add('correct');
                feedbackEl.innerText = "Correct!";
                feedbackEl.style.color = '#16a34a';
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackEl.innerText = "Sorry, that's not right.";
                feedbackEl.style.color = '#dc2626';
            }

            Array.from(answerButtonsEl.children).forEach(button => {
                if (button.dataset.correct === 'true') {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });

            const currentQuestion = quizQuestions[currentQuestionIndex];
            if (currentQuestion.explanation) {
                explanationText.innerText = currentQuestion.explanation;
                explanationContainer.classList.remove('hidden');
            }

            if (quizQuestions.length > currentQuestionIndex + 1) {
                nextBtn.classList.remove('hidden');
            } else {
                nextBtn.innerText = 'Show Results';
                nextBtn.classList.remove('hidden');
            }
        }

        function showResults() {
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            scoreTextEl.innerText = `${score} / ${quizQuestions.length}`;
            nextBtn.innerText = 'Next Question';
        }

    </script>
</body>

</html>
