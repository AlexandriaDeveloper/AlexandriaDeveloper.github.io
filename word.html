<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Processing Test - Timed Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Chosen Palette: Calm Neutrals (Slate, Sky, Green, Red) -->
    <!-- Application Structure Plan: The app is designed as a timed quiz flow. 1. Start Screen: Welcomes the user and explains the rules (timed quiz, question types). A clear "Start" button initiates the test. 2. Quiz Screen: This is the core interactive view. It displays one question at a time with options. A prominent timer counts down. User selection provides immediate feedback. This focused view prevents overwhelm. 3. Results Screen: Appears when the timer ends or all questions are answered. It shows the score, a summary, and an option to restart. This structure provides a clear, task-oriented user journey from start to finish. -->
    <!-- Visualization & Content Choices: Report Info: Q&A List -> Goal: Test Knowledge -> Viz/Method: Interactive Quiz UI (HTML/CSS/JS) -> Interaction: Select answer, see immediate feedback (color change), auto-advance -> Justification: Simulates a test environment and provides instant learning reinforcement. Report Info: Time Constraint -> Goal: Add Challenge -> Viz/Method: Countdown Timer (JS) -> Interaction: Visual countdown -> Justification: Adds urgency and simulates exam conditions. Report Info: Final Score -> Goal: Summarize Performance -> Viz/Method: Results Card (HTML/CSS) -> Interaction: View score, restart quiz -> Justification: Provides clear feedback on performance and allows for re-engagement. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f5f9;
            /* slate-100 */
        }

        .answer-btn.correct {
            background-color: #4ade80 !important;
            /* green-400 */
            color: white !important;
            border-color: #22c55e !important;
        }

        .answer-btn.incorrect {
            background-color: #f87171 !important;
            /* red-400 */
            color: white !important;
            border-color: #ef4444 !important;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div id="quiz-app" class="w-full max-w-2xl mx-auto">

        <!-- Start Screen -->
        <div id="start-screen" class="bg-white p-8 rounded-xl shadow-lg text-center">
            <h1 class="text-3xl font-bold text-slate-900 mb-4">Word Processing Test</h1>
            <p class="text-slate-600 mb-2">This quiz is based on questions from the "Tahrir Sinai" file, in their
                original order.</p>
            <p class="text-slate-600 mb-6">You have <strong class="text-sky-600">25 minutes</strong> to answer 68
                questions.</p>
            <button id="start-btn"
                class="w-full bg-sky-500 text-white font-bold py-3 px-6 rounded-lg hover:bg-sky-600 transition-colors duration-300 text-lg">
                Start Quiz
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <div id="timer" class="text-lg font-bold bg-slate-200 text-slate-800 px-4 py-2 rounded-lg">
                        Time: 25:00
                    </div>
                    <div id="progress" class="text-sm font-semibold text-slate-500">
                        Question 1 / 68
                    </div>
                </div>
                <div class="h-1 w-full bg-slate-200 rounded-full mb-6">
                    <div id="progress-bar" class="h-1 bg-sky-500 rounded-full transition-all duration-300"
                        style="width: 0%;"></div>
                </div>

                <div id="question-container" class="mb-6 min-h-[100px]">
                    <h2 id="question-text" class="text-xl font-semibold text-center text-slate-900"></h2>
                </div>

                <div id="answers-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden">
            <div class="bg-white p-8 rounded-xl shadow-lg text-center">
                <h2 id="results-title" class="text-3xl font-bold text-slate-900 mb-4">Time's Up!</h2>
                <p class="text-slate-600 mb-6 text-lg">Your final score is:</p>
                <div
                    class="bg-sky-100 border-2 border-sky-200 rounded-full w-40 h-40 mx-auto flex flex-col justify-center items-center mb-6">
                    <span id="score" class="text-4xl font-bold text-sky-700">0</span>
                    <span id="score-total" class="text-slate-600">of 68</span>
                </div>
                <p id="results-summary" class="text-slate-600 mb-6"></p>
                <button id="restart-btn"
                    class="w-full bg-sky-500 text-white font-bold py-3 px-6 rounded-lg hover:bg-sky-600 transition-colors duration-300 text-lg">
                    Try Again
                </button>
            </div>
        </div>

    </div>

    <script>
        const allQuestions = [
            { q: 'To control document margins, select...', options: ['page setup', 'Paragraph', 'Font', 'Styles'], a: 'page setup' },
            { q: 'To move a word, it must be cut.', a: false },
            { q: 'To choose wide margins within the document from the... group.', options: ['page setup', 'Themes', 'Page Background', 'Arrange'], a: 'page setup' },
            { q: 'To choose wide margins within the document from the ... tab.', options: ['Layout', 'Insert', 'Home', 'View'], a: 'Layout' },
            { q: 'Ribbon has been included in Office applications since Office 2007.', a: true },
            { q: 'The quick style created appears in … group.', options: ['Style', 'Font', 'Editing', 'Clipboard'], a: 'Style' },
            { q: 'To change the format of a table in Word from a tab ...', options: ['Table Design', 'Layout', 'References', 'Mailings'], a: 'Table Design' },
            { q: 'Spelling errors in Word are marked with a … line under the word.', options: ['blue', 'red', 'green', 'yellow'], a: 'red' },
            { q: 'The endnote appears in the bottom margin of each page.', a: false },
            { q: 'Translation is available within Word via the Thesaurus tool.', a: false },
            { q: 'Press ... key to print the document.', options: ['Ctrl + S', 'Ctrl + C', 'Ctrl + P', 'Ctrl + V'], a: 'Ctrl + P' },
            { q: 'Text cannot be replaced within a Word document.', a: false },
            { q: 'To view different sections of a document at the same time ...', options: ['Split', 'New Window', 'Arrange All', 'View Side by Side'], a: 'Split' },
            { q: 'The shortcut to close the Word file is …', options: ['Ctrl + W', 'Ctrl + Q', 'Alt + F4', 'Ctrl + X'], a: 'Ctrl + W' },
            { q: 'To write a comment on a word, press key …', options: ['Ctrl + Alt + M', 'Ctrl + K', 'Ctrl + Shift + C', 'Alt + C'], a: 'Ctrl + Alt + M' },
            { q: 'You can add a comment on some words using the ... tab.', options: ['Review', 'Insert', 'View', 'Home'], a: 'Review' },
            { q: 'If you have multiple Word documents open at once, you can switch between open windows by Switch windows, window group, view tab.', a: true },
            { q: 'To add page numbering within a word document using … group.', options: ['Header and Footer', 'Text', 'Symbols', 'Pages'], a: 'Header and Footer' },
            { q: 'It is possible to control the display of the ruler from the …', options: ['In the Show group of the View tab', 'In the Zoom group of the View tab', 'In the Page Setup group of the Layout tab', 'In the Font group of the Home tab'], a: 'In the Show group of the View tab' },
            { q: 'The indent can be set using the ... sign.', options: ['Tab', 'Space', 'Enter', 'Shift'], a: 'Tab' },
            { q: 'You can write in a Word document in three columns through a group ...', options: ['Page Setup', 'Paragraph', 'Font', 'Arrange'], a: 'Page Setup' },
            { q: 'To control adding a cell or column within a table in a Word file from the tab ...', options: ['Table Layout', 'Table Design', 'Insert', 'Home'], a: 'Table Layout' },
            { q: 'To change the format of a word, it must be selected first.', a: true },
            { q: 'The head and footer appear in read mode.', a: false },
            { q: 'The header and footer settings appear in read mode.', a: false },
            { q: 'You can search for a word from the ... tab.', options: ['Home', 'Insert', 'View', 'Review'], a: 'Home' },
            { q: 'To resize a page in the word, use … group.', options: ['page setup', 'Scale', 'Size', 'Arrange'], a: 'page setup' },
            { q: 'To resize a page in the word, use … tab.', options: ['Layout', 'Design', 'File', 'View'], a: 'Layout' },
            { q: 'You can insert page break, from …', options: ['Insert', 'Layout', 'Home', 'Design'], a: 'Insert' },
            { q: 'You can insert breaks, from …', options: ['Layout', 'Insert', 'References', 'View'], a: 'Layout' },
            { q: 'We can add a chart from photo option.', a: false },
            { q: 'You can insert a chart from a photo group.', a: false },
            { q: 'You can insert a chart from a photo collection (illustrations group).', a: false },
            { q: '... is a set of characteristics, such as font name, size, color, paragraph alignment, spacing, border and shading.', options: ['Style', 'Theme', 'Template', 'Format'], a: 'Style' },
            { q: 'An equation can be inserted from a set of symbols.', a: true },
            { q: 'You can move between changes tracked by the file but you can\'t approve or reject them.', a: false },
            { q: 'To add the signature line, from ….. group.', options: ['Text', 'Illustrations', 'Symbols', 'Header & Footer'], a: 'Text' },
            { q: 'A document watermark can be made through a group …', options: ['Page Background', 'Page Setup', 'Themes', 'Paragraph'], a: 'Page Background' },
            { q: 'Paragraph borders appear on the horizontal ruler only by clicking on the beginning of the Paragraph.', a: false },
            { q: 'Paragraph borders appear on the horizontal ruler by clicking on the beginning of the Paragraph.', a: true },
            { q: 'In print page preview mode, you can see all the pages of your document.', a: true },
            { q: 'The document can be saved in different formats except …', options: ['.exe', '.pdf', '.docx', '.txt'], a: '.exe' },
            { q: 'It is possible to control the insertion of a footnote into the word processor from a master tab.', a: false },
            { q: 'You can insert three dimensional models from ... set.', options: ['illustrations', 'Media', 'Text', 'Add-ins'], a: 'illustrations' },
            { q: 'You can translate by selecting the word and right clicking on it.', a: true },
            { q: 'A page break can be inserted from Breaks tab.', a: false },
            { q: 'Used to place frames and show them together in a horizontal plane …', options: ['Arrange all', 'View Side by Side', 'Split', 'Switch Windows'], a: 'Arrange all' },
            { q: 'Allows you to move through the pages of a document in a structured view…', options: ['Navigation pane', 'Ruler', 'Gridlines', 'Thumbnails'], a: 'Navigation pane' },
            { q: 'The headers and footers were not visible in .. view.', options: ['Draft', 'Print Layout', 'Web Layout', 'Read Mode'], a: 'Draft' },
            { q: 'The default view in Word is the …', options: ['Print layout', 'Read Mode', 'Web Layout', 'Outline'], a: 'Print layout' },
            { q: 'Cross references are updated automatically.', a: false },
            { q: '…. are text below illustrations.', options: ['Captions', 'Footnotes', 'Endnotes', 'Comments'], a: 'Captions' },
            { q: 'The method of numbering the footnote cannot be changed to be alphabetically instead of traditional numbers.', a: false },
            { q: 'When you click "Save selection as a new Quick Style", the style should not be named.', a: false },
            { q: 'Status bar contains the number of words in a word processor document.', a: true },
            { q: 'The document is printed or previewed before printing from the View tab.', a: false },
            { q: 'A style is a set of characteristics, such as font name, size, color, paragraph alignment, spacing, borders and shading.', a: true },
            { q: 'The Footnote and Endnote dialog box contains options to control how they appear from the master tab.', a: false },
            { q: 'The Footnote and Endnote dialog box contains options to control how they appear from the References tab.', a: true },
            { q: 'Start Mail Merge group contains a recipient selection tool (Select Recipients) which allows us to write a new list.', a: false },
            { q: 'Start Mail Merge section contains a set of tools that identify the recipients of a message.', a: false },
            { q: 'In print page preview mode, you can see...', options: ['all the pages of your document', 'the current page only', 'even pages only', 'odd pages only'], a: 'all the pages of your document' },
            { q: 'You can translate a word by clicking on it.', a: true },
            { q: 'Information in the Citations or Manage Sources tool cannot be used to create footnotes or endnotes.', a: true },
            { q: 'The document saves with extension HMT for display on the Web.', a: false },
            { q: 'To add an additional shape in a SmartArt graphic …', options: ['Right-click on the shape and choose "Add Shape"', 'Press Enter', 'Drag and drop from the shapes list', 'Go to the Insert tab'], a: 'Right-click on the shape and choose "Add Shape"' },
            { q: 'The position of images in the document is determined by the group ....', options: ['Arrange', 'Picture Styles', 'Size', 'Adjust'], a: 'Arrange' },
            { q: 'To view the origin of the merged fields, we choose ...', options: ['Highlight fields', 'Preview Results', 'Address Block', 'Greeting Line'], a: 'Highlight fields' },
        ];

        const QUIZ_LENGTH = allQuestions.length;
        const QUIZ_TIME = 1500; // 25 minutes in seconds

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = QUIZ_TIME;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        const timerEl = document.getElementById('timer');
        const progressEl = document.getElementById('progress');
        const progressBarEl = document.getElementById('progress-bar');
        const questionTextEl = document.getElementById('question-text');
        const answersContainerEl = document.getElementById('answers-container');
        const scoreEl = document.getElementById('score');
        const scoreTotalEl = document.getElementById('score-total');
        const resultsTitleEl = document.getElementById('results-title');
        const resultsSummaryEl = document.getElementById('results-summary');

        startBtn.addEventListener('click', startQuiz);
        restartBtn.addEventListener('click', () => {
            resultsScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            questions = allQuestions;
            currentQuestionIndex = 0;
            score = 0;
            timeLeft = QUIZ_TIME;

            progressEl.textContent = `Question 1 / ${QUIZ_LENGTH}`;
            scoreTotalEl.textContent = `of ${QUIZ_LENGTH}`;

            displayQuestion();
            startTimer();
        }

        function startTimer() {
            timerEl.textContent = `Time: ${formatTime(timeLeft)}`;
            timer = setInterval(() => {
                timeLeft--;
                timerEl.textContent = `Time: ${formatTime(timeLeft)}`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    showResults(true);
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            /**
             * Starts the timer countdown for the quiz.
             * @param {number} timeLeft The amount of time left in the quiz.
             * @param {HTMLElement} timerEl The element to display the timer text in.
             * @param {boolean} showResultsOnTimeout Whether to show the results screen
             *  immediately when the timer runs out, or wait for the user to answer
             *  the current question.
             */
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        function displayQuestion() {
            const question = questions[currentQuestionIndex];
            questionTextEl.textContent = question.q;
            answersContainerEl.innerHTML = '';

            const options = question.options ? question.options : ['True', 'False'];

            options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('answer-btn', 'w-full', 'p-4', 'rounded-lg', 'border-2', 'border-slate-300', 'bg-slate-100', 'hover:bg-slate-200', 'hover:border-slate-400', 'transition-colors', 'duration-200', 'font-semibold');
                button.addEventListener('click', () => selectAnswer(button, option, question));
                answersContainerEl.appendChild(button);
            });

            progressEl.textContent = `Question ${currentQuestionIndex + 1} / ${QUIZ_LENGTH}`;
            progressBarEl.style.width = `${((currentQuestionIndex + 1) / QUIZ_LENGTH) * 100}%`;
        }

        function selectAnswer(button, selectedOption, question) {
            const isTfQuestion = !question.options;
            const selectedAnswer = isTfQuestion ? (selectedOption === 'True') : selectedOption;
            const isCorrect = selectedAnswer === question.a;

            if (isCorrect) {
                score++;
                button.classList.add('correct');
            } else {
                button.classList.add('incorrect');
                // Highlight the correct answer for T/F questions
                if (isTfQuestion) {
                    Array.from(answersContainerEl.children).forEach(btn => {
                        const optionValue = (btn.textContent === 'True');
                        if (optionValue === question.a) {
                            btn.classList.add('correct');
                        }
                    });
                }
            }

            // Disable all buttons
            Array.from(answersContainerEl.children).forEach(btn => {
                btn.disabled = true;
            });

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < QUIZ_LENGTH) {
                    displayQuestion();
                } else {
                    clearInterval(timer);
                    showResults(false);
                }
            }, 1500);
        }

        function showResults(timeUp) {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');

            scoreEl.textContent = score;
            if (timeUp) {
                resultsTitleEl.textContent = "Time's Up!";
            } else {
                resultsTitleEl.textContent = "Quiz Complete!";
            }
            resultsSummaryEl.textContent = `You answered ${score} out of ${QUIZ_LENGTH} questions correctly.`;
        }

    </script>
</body>

</html>
